# ============================================================================== 
# Infrastructure: Local Containerized Data Stack
# Services:
#   - postgres_db: خادم PostgreSQL 15 لإدارة مستودع البيانات (Port: 5432).
#   - pgadmin: واجهة إدارة قواعد البيانات الرسومية المستندة للويب (Port: 8080).
# Volumes:
#   - pgdata: للحفاظ على استمرارية البيانات محلياً عند إعادة التشغيل.
#   - schema.sql initialization: تنفيذ هيكل الجداول تلقائياً عند أول تشغيل للحاوية.
# ============================================================================== 

version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: saudi-fmcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fmcg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fmcg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: saudi-fmcg-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
